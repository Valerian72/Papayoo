<style>

.pr .sc2{text-align:right}.pr .sc2 b{font-size:34px;line-height:1}.pr .lp{color:var(--acc);margin-left:6px;font-size:14px}

.pr .rk0{width:40px!important}.rk0 small{font-size:12px}
.pod2{display:flex;align-items:flex-end;justify-content:center;gap:8px}.pc3{flex:1;max-width:120px;text-align:center}
.bar3{border-radius:8px 8px 0 0;margin-top:4px;transform-origin:bottom;animation:grow 1s ease-out both}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

.seg{display:flex;gap:6px}.seg .btn{flex:1;font-size:16px}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}

.sub{color:var(--mut);margin:0 0 16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}

.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}

th{font-weight:600;color:var(--mut);font-size:14px}th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}

.bar{display:inline-block;height:8px;border-radius:4px;background:var(--acc);vertical-align:middle;margin-left:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.grid7{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}

.hm td{text-align:center;font-size:14px;padding:8px 4px}.note{color:var(--mut);font-size:14px}

.tag{font-size:13px;color:var(--mut)}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:8px 0 4px}
.pod>div{flex:1;max-width:190px;text-align:center}.pod .st{border-radius:10px 10px 0 0;padding:10px 6px;color:#1c2433;font-weight:800;font-family:"Bricolage Grotesque",sans-serif}

.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.tg .card{margin:0;display:flex;gap:12px;align-items:flex-start}.tg .ic{font-size:34px;line-height:1}.tg .tt{font-size:13px;color:var(--mut)}.tg .nm{font:800 19px "Bricolage Grotesque",sans-serif}
.rk{display:flex;gap:8px;flex-wrap:wrap}.rk span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
main{padding-bottom:96px}

#bar button[aria-selected="true"]{color:var(--acc);background:var(--bg)}#bar .e{font-size:22px;line-height:1.1}
.tot{font-weight:600}
.cp{min-width:0}.cp th,.cp td{padding:7px 4px;font-size:15px;white-space:normal}.cp .dot{margin-right:5px}

  const app=initializeApp(firebaseConfig);
  const store=initializeFirestore(app,{experimentalAutoDetectLongPolling:true});
  const clean=d=>JSON.parse(JSON.stringify(d));
  const fail=e=>{console.error('Firestore',e);if(e&&e.code==='permission-denied')fbWarn('Firestore refuse l\'accès (permission-denied) : vérifie les règles Firestore.');else fbWarn('Firebase : '+((e&&e.code)||'erreur')+'. Vérifie ta connexion et la configuration.')};
  const snapDoc=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
  const snapCol=s=>({docs:s.docs.map(x=>({id:x.id,data:()=>x.data()}))});
  // Interface simple utilisée par l'application : doc(path) et collection(path)
  const api={
    doc:p=>{const r=doc(store,p);return{
      set:d=>setDoc(r,clean(d)),
      update:d=>setDoc(r,clean(d),{merge:true}),
      delete:()=>deleteDoc(r),
      onSnapshot:(ok,err)=>onSnapshot(r,s=>ok(snapDoc(s)),e=>{fail(e);err&&err(e)})}},
    collection:p=>{const c=collection(store,p);return{
      doc:id=>api.doc(p+'/'+id),
      get:()=>getDocs(c).then(snapCol),
      onSnapshot:(ok,err)=>onSnapshot(c,s=>ok(snapCol(s)),e=>{fail(e);err&&err(e)})}}
  };

}catch(e){console.error(e);fbWarn(e.message||'Firebase indisponible.');window.__fbOk(null)}

<script>
let P=['Valerian','Thomas','Sebastien','Matthieu','Mickael','Luidji','Damien'];
const COL=['#e8590c','#1c7ed6','#2f9e44','#ae3ec9','#f08c00','#d6336c','#0b7285','#495057','#5c940d','#862e9c','#c92a2a','#1864ab'];
const PTS=[15,12,10,7,5,3,0];
let ALL=[],db=null,canW=true,status='Connexion à la base…';
let tab='so',minN=40,off=new Set(),CFG={mode:'idx',bonus:0,pts:[15,12,10,7,5,3,0]},pj=null,per='sem',pk=null;
let SEAS=[],SSEL=(()=>{try{return localStorage.getItem('pp_ss')||'cur'}catch(e){return'cur'}})();
const sSorted=()=>[...SEAS].sort((a,b)=>a.d<b.d?-1:1),sCur=()=>{const l=sSorted();return l.length?l[l.length-1].id:'all'},sSel=()=>SSEL=='cur'?sCur():SSEL;
const sBounds=id=>{const l=sSorted();if(id=='all'||!l.length)return null;if(id=='pre')return['0000',l[0].d];const i=l.findIndex(x=>x.id==id);return i<0?null:[l[i].d,l[i+1]?l[i+1].d:'9999']};
const G=()=>{const b=sBounds(sSel()),r=b?ALL.filter(g=>g[0]>=b[0]&&g[0]<b[1]):ALL;const xc=i=>TR.has(i)||(!incg()&&GU.has(i));if(tab=='sa'||(!TR.size&&(incg()||!GU.size)))return r;return r.map(g=>[g[0],g[1].map((v,i)=>xc(i)?null:v),...g.slice(2)]).filter(g=>g[1].filter(v=>v!=null).length>=3)};
const f=(x,d=0)=>x.toLocaleString('fr-FR',{maximumFractionDigits:d,minimumFractionDigits:d});
const pc=x=>f(x*100,0)+' %';
function perf(sc){const pl=sc.map((v,i)=>v==null?-1:i).filter(i=>i>=0),n=pl.length,o={};
 if(n<2)return o;pl.forEach(i=>{const r=1+pl.filter(j=>sc[j]<sc[i]).length;
 o[i]={n,r,idx:(n-r)/(n-1),w:pl.every(j=>sc[j]>=sc[i]),l:pl.every(j=>sc[j]<=sc[i])}});return o}
const cf=n=>1+CFG.bonus/100*(n-3)/4;
function stats(gs){const E=elo(gs||G()),S=P.map(()=>({n:0,w:0,l:0,s:0,idx:0,pts:0,pt:0}));
 (gs||G()).forEach(([d,sc])=>{const o=perf(sc);for(const i in o){const p=o[i],s=S[i];s.n++;s.s+=sc[i];s.w+=p.w;s.l+=p.l;s.idx+=p.idx;s.pts+=CFG.pts[Math.min(p.r-1,6)];s.pt+=p.idx*100*cf(p.n)}});
 return S.map((s,i)=>{const o={i,name:P[i],n:s.n,w:s.w/s.n,l:s.l/s.n,avg:s.s/s.n,idx:s.idx/s.n,pts:s.pts/s.n,pt:s.pt/s.n};o.elo=E[i];o.m=CFG.mode=='idx'?o.pt:CFG.mode=='pts'?o.pts:CFG.mode=='elo'?o.elo:-o.avg;return o})}
const lab=s=>CFG.mode=='idx'?f(s.m):CFG.mode=='pts'?f(s.m,1)+' pts':CFG.mode=='elo'?f(s.m)+' Elo':f(-s.m)+' moy.';
async function setCfg(c){if(!ADM)return;CFG={...CFG,...c};render();if(db)try{await db.doc('config/bareme').set(CFG)}catch(e){}}
function hh(){const H=P.map(()=>P.map(()=>[0,0]));G().forEach(([d,sc])=>P.forEach((_,a)=>P.forEach((_,b)=>{if(a!=b&&sc[a]!=null&&sc[b]!=null){H[a][b][1]++;if(sc[a]<sc[b])H[a][b][0]++}})));return H}
const ord=n=>n==1?'1er':n+'e',dt=d=>new Date(d).toLocaleDateString('fr-FR'),avg=x=>x.reduce((p,q)=>p+q,0)/x.length;
function ins(){const g=G(),S=stats().filter(s=>s.n>=minN);if(S.length<3)return[];
 const out=[],H=hh(),by=k=>[...S].sort((a,b)=>k(a)-k(b)),I=by(s=>-s.m);
 const [a,b,c]=I,gap=(b.m-c.m)/(Math.abs(a.m)||1);
 const opp=P.map((_,j)=>j).filter(j=>j!=a.i&&H[a.i][j][1]>=10).map(j=>({j,r:H[a.i][j][0]/H[a.i][j][1]}));
 const all=opp.every(o=>o.r>.5),top=[...opp].sort((x,y)=>y.r-x.r)[0];
 out.push(['Le haut du classement',`${a.name} et ${b.name} ${gap>.05?'dominent clairement':'sont en tête'}. ${a.name} n'est dernier que dans ${pc(a.l)} de ses parties${top?` et ${all?'bat tout le monde en duel':'domine ses duels'} (${pc(top.r)} contre ${P[top.j]})`:''}.`]);
 const ex=S.map(s=>{let e=0;g.forEach(([d,sc])=>{if(sc[s.i]!=null)e+=1/sc.filter(v=>v!=null).length});return{...s,e,wc:Math.round(s.w*s.n)}});
 const luck=[...ex].sort((x,y)=>(x.wc-x.e)-(y.wc-y.e)),lo=luck[0],hi=luck[luck.length-1],lz=by(s=>-s.l)[0];
 out.push(['Victoires attendues',`${lo.name} a gagné ${lo.wc} parties alors qu'on en attendrait environ ${f(lo.e)} au hasard, et ${lz.name} est dernier dans ${pc(lz.l)} de ses parties. À l'inverse, ${hi.name} a gagné ${hi.wc} parties pour ${f(hi.e)} attendues.`]);
 const rk=k=>{const m={};by(k).forEach((s,i)=>m[s.i]=i+1);return m},r1=rk(s=>-s.idx),r2=rk(s=>-s.pts),r3=rk(s=>s.avg);
 const df=S.filter(s=>new Set([r1[s.i],r2[s.i],r3[s.i]]).size>1);
 out.push(['Selon la méthode',df.length?`Le classement change selon la méthode : ${df.map(s=>`${s.name} est ${ord(r1[s.i])} à l'indice, ${ord(r2[s.i])} au barème et ${ord(r3[s.i])} au score moyen`).join(' ; ')}. Bascule d'une méthode à l'autre dans l'onglet Classement.`:'Les trois méthodes (indice, barème, score moyen) donnent le même classement.']);
 const sz=S.map(s=>{const A=[],B=[];g.forEach(([d,sc])=>{const o=perf(sc),n=sc.filter(v=>v!=null).length;if(o[s.i])(n<=4?A:B).push(o[s.i].idx)});return{n:s.name,a:A.length>=8?avg(A):null,b:B.length>=8?avg(B):null}}).filter(x=>x.a!=null&&x.b!=null).sort((x,y)=>(y.a-y.b)-(x.a-x.b));
 if(sz.length>1){const u=sz[0],v=sz[sz.length-1];out.push(['Taille de table',`${u.n} brille surtout à petite table (indice ${f(u.a*100)} à 3-4 joueurs contre ${f(u.b*100)} à 5 et plus), alors que ${v.n} est meilleur quand la table est pleine (${f(v.b*100)} contre ${f(v.a*100)}).`])}
 const fm=S.map(s=>{const l=[];g.forEach(([d,sc])=>{const o=perf(sc);if(o[s.i])l.push(o[s.i].idx)});return{n:s.name,d:avg(l.slice(-15))-s.idx}}).sort((x,y)=>y.d-x.d),up=fm[0],dn=fm[fm.length-1];
 out.push(['Forme du moment',`${up.d>0?`${up.n} est en forme : ${f(up.d*100)} points d'indice de plus que sa moyenne sur ses 15 dernières parties.`:'Personne n\'est vraiment en progression.'} ${dn.d<0?`${dn.n} traverse un creux (${f(dn.d*100)} points).`:''}`]);
